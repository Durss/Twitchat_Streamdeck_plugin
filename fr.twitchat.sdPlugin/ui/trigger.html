<!doctype html>
<html>
	<head lang="en">
		<title>Trigger</title>
		<meta charset="utf-8" />
		<script src="./sdpi-components.js"></script>
		<script type="module" src="./common.js"></script>
		<script src="./locale.js"></script>
		<link rel="stylesheet" href="./styles.css" />
	</head>

	<body>
		<sdpi-item label="__MSG_trigger.fields.triggerId__">
			<sdpi-select setting="triggerId" datasource="getTriggers" loading="__MSG_trigger.loading-triggers__" hot-reload> </sdpi-select>
		</sdpi-item>

		<sdpi-item label="__MSG_trigger.fields.triggerAction__">
			<sdpi-select setting="triggerAction" default="EXECUTE">
				<option value="EXECUTE">__MSG_trigger.action.EXECUTE__</option>
				<option value="ENABLE">__MSG_trigger.action.ENABLE__</option>
				<option value="DISABLE">__MSG_trigger.action.DISABLE__</option>
				<option value="TOGGLE">__MSG_trigger.action.TOGGLE__</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
