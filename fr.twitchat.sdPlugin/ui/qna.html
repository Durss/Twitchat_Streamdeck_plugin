<!doctype html>
<html>
	<head lang="en">
		<title>Q&A</title>
		<meta charset="utf-8" />
		<script src="./sdpi-components.js"></script>
		<script type="module" src="./common.js"></script>
		<script src="./locale.js"></script>
		<link rel="stylesheet" href="./styles.css" />
	</head>

	<body>
		<sdpi-item label="__MSG_qna.fields.qnaId__">
			<sdpi-select setting="qnaId" datasource="getQnas" loading="__MSG_qna.loading-qnas__" hot-reload> </sdpi-select>
		</sdpi-item>

		<sdpi-item label="__MSG_qna.fields.qnaAction__">
			<sdpi-select setting="qnaAction" default="highlight">
				<option value="highlight">__MSG_qna.action.highlight__</option>
				<option value="skip">__MSG_qna.action.skip__</option>
			</sdpi-select>
		</sdpi-item>
	</body>
</html>
