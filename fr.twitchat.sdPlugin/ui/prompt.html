<!doctype html>
<html>
	<head lang="en">
		<title>Prompt window</title>
		<meta charset="utf-8" />
		<script src="./sdpi-components.js"></script>
		<script type="module" src="./common.js"></script>
		<script src="./locale.js"></script>
		<link rel="stylesheet" href="./styles.css" />
	</head>

	<body>
		<sdpi-item label="__MSG_prompt.fields.promptAction__">
			<sdpi-select setting="promptAction" default="accept">
				<option value="accept">__MSG_prompt.action.accept__</option>
				<option value="reject">__MSG_prompt.action.reject__</option>
			</sdpi-select>
		</sdpi-item>

		<sdpi-item>
			<sdpi-i18n key="prompt.info"></sdpi-i18n>
		</sdpi-item>
	</body>
</html>
